<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PhishBlock</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #e8f0f8;
    }
    * { box-sizing: border-box; }
    body { width: 360px; margin: 0; background: linear-gradient(145deg, #07111f 0%, #0b1728 100%); }
    .shell { padding: 18px; }
    .brand { display: flex; align-items: center; gap: 11px; margin-bottom: 18px; }
    .brand-mark { width: 42px; height: 42px; display: block; border: 1px solid #21405e; border-radius: 12px; background: #10243a; box-shadow: 0 8px 20px rgba(0, 151, 219, .18); object-fit: cover; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: .01em; }
    .brand p { margin: 2px 0 0; color: #8193a8; font-size: 11px; }
    .card { padding: 15px; border: 1px solid #1b3047; border-radius: 16px; background: rgba(15, 31, 49, .88); box-shadow: 0 16px 35px rgba(0,0,0,.22); }
    .label { margin-bottom: 7px; color: #71849a; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .url { min-height: 34px; color: #d9e5f1; font-size: 12px; line-height: 1.45; overflow-wrap: anywhere; }
    .divider { height: 1px; margin: 13px 0; background: #1d334b; }
    .status-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .status { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border-radius: 999px; background: #17283a; color: #a9b7c6; font-size: 11px; font-weight: 700; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(169,183,198,.12); }
    .status.safe { background: rgba(24, 187, 126, .12); color: #52d9a4; }
    .status.medium { background: rgba(245, 172, 45, .13); color: #ffc65c; }
    .status.high { background: rgba(239, 79, 93, .13); color: #ff7783; }
    .score { color: #8ca1b6; font-size: 11px; }
    .details { min-height: 37px; margin-top: 11px; color: #9cafc2; font-size: 11px; line-height: 1.5; }
    button { width: 100%; margin-top: 14px; padding: 11px 14px; border: 1px solid #2d79a7; border-radius: 11px; background: linear-gradient(135deg, #168bc8, #1474ae); color: #fff; cursor: pointer; font: inherit; font-size: 12px; font-weight: 700; transition: transform .15s ease, filter .15s ease; }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:disabled { cursor: wait; filter: grayscale(.35); opacity: .7; transform: none; }
    .footer { display: flex; justify-content: space-between; margin-top: 12px; color: #60758b; font-size: 10px; }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <img class="brand-mark" src="icons/icon128.png" alt="PhishBlock logo" />
      <div><h1>PhishBlock</h1><p>Real-time browsing protection</p></div>
    </header>

    <section class="card">
      <div class="label">Current destination</div>
      <div id="url" class="url">Loading active page...</div>
      <div class="divider"></div>
      <div class="status-row">
        <div id="status" class="status">Checking status</div>
        <div id="score" class="score"></div>
      </div>
      <div id="details" class="details">Waiting for the latest security assessment.</div>
      <button id="recheck" type="button">Run security check</button>
    </section>

    <footer class="footer"><span>Campus endpoint protection</span><span>v1.1</span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
