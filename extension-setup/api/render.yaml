services:
  - type: web
    name: phishing-api
    runtime: python
    rootDir: extension-setup/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PATH
        value: dataset/phishing_url_bundle.joblib
